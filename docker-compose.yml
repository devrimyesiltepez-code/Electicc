version: '3.9'

services:
  backend:
    build: ./backend
    ports:
      - '8000:8000'
    volumes:
      - ./backend/data:/app/data
    environment:
      - APP_PASSWORD=panel123
      - CORS_ORIGIN=http://localhost:5173

  frontend:
    build: ./frontend
    ports:
      - '5173:5173'
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_APP_PASSWORD=panel123
    depends_on:
      - backend
